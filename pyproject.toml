[project]
name = "gar"
version = "0.1.0"
description = "Hybrid legal RAG system for PDF ingestion and OpenAI-compatible chat."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.0.0",
    "fastapi>=0.115.0",
    "langchain>=0.3.0",
    "langchain-chroma>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "pillow>=11.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pymupdf>=1.25.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.3.0",
    "torch>=2.6.0",
    "transformers>=4.48.0",
    "typer>=0.15.0",
    "uvicorn>=0.34.0",
    "xformers>=0.0.35",
]

[project.scripts]
gar = "gar.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
